# Checkpoint Module 02 — Phần C: hệ thống "taskhub-edge-02" sau đợt chuyển máy
# Khởi động:  docker compose up -d
# Dọn dẹp:    docker compose down -v
#
# Mạng edge_net 172.29.1.0/24:
#   edge (nginx, HTTPS)  172.29.1.10
#   dns  (dnsmasq)       172.29.1.53   — DNS nội bộ cho miền taskhub.test
#   api, client          IP động

name: netcp02

networks:
  edge_net:
    ipam:
      config:
        - subnet: 172.29.1.0/24

volumes:
  certs:

services:
  # Sinh chứng chỉ TLS tự ký cho edge rồi thoát
  certgen:
    image: alpine:3.20
    command: ["sh", "/opt/certgen/gen.sh"]
    volumes:
      - ./certs:/opt/certgen:ro
      - certs:/certs
    networks:
      - edge_net

  # DNS server nội bộ cho miền taskhub.test
  dns:
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        apk add --no-cache dnsmasq >/dev/null &&
        exec dnsmasq --keep-in-foreground --no-resolv --server=127.0.0.11
        --no-hosts --addn-hosts=/etc/taskhub-dns/hosts.taskhub
        --local-ttl=300 --listen-address=172.29.1.53 --bind-interfaces
        --log-queries --log-facility=-
    volumes:
      - ./dns:/etc/taskhub-dns:ro
    networks:
      edge_net:
        ipv4_address: 172.29.1.53

  # API phía sau edge
  api:
    image: python:3.12-slim
    command: ["python", "/srv/server.py"]
    environment:
      APP_NAME: api
      BIND_ADDR: "0.0.0.0"
      APP_PORT: "8000"
      SLOW_PATH: /api/report
      SLOW_SECONDS: "8"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps:/srv:ro
    networks:
      - edge_net

  # Reverse proxy HTTPS — máy mới sau đợt chuyển
  edge:
    image: nginx:1.30-alpine
    volumes:
      - ./edge/conf.d:/etc/nginx/conf.d:ro
      - certs:/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      edge_net:
        ipv4_address: 172.29.1.10

  # Máy monitoring — nơi bạn đứng để kiểm tra
  client:
    image: ubuntu:22.04
    hostname: monitor
    command: ["bash", "/opt/lab/client-init.sh"]
    dns:
      - 172.29.1.53
    volumes:
      - ./client:/opt/lab:ro
      - certs:/certs:ro
    depends_on:
      - dns
    networks:
      - edge_net
