# edge — reverse proxy HTTPS của taskhub (máy mới)

# Port 80: request có Host không khớp server nào rơi vào đây
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 404 "unknown site\n";
}

# Port 80 cho app: healthcheck của monitoring + chuyển hướng sang HTTPS
server {
    listen 80;
    server_name app.taskhub.tset;
    default_type text/plain;

    location = /health {
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: ứng dụng
server {
    listen 443 ssl;
    server_name app.taskhub.test;

    ssl_certificate     /certs/edge.crt;
    ssl_certificate_key /certs/edge.key;

    default_type text/plain;

    location = / {
        return 200 "taskhub app OK\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
