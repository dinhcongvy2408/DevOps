# Reverse proxy của taskhub-edge
server {
    listen 80;
    server_name _;

    # DNS nội bộ của Docker — tên dịch vụ được phân giải lúc có request
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 5s;
    proxy_read_timeout    10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        default_type text/plain;
        return 200 "taskhub-edge OK\n";
    }

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location /reports/ {
        set $reports_upstream http://reports:9000;
        proxy_pass $reports_upstream;
    }

    location /status/ {
        set $status_upstream http://status:9100;
        proxy_pass $status_upstream;
    }
}
