# Bản tham khảo cho dự án taskhub v3. Chép vào: .github/workflows/deploy.yml
# Chỉ mở file này SAU KHI đã tự viết workflow của mình (milestone v3).
#
# Luồng:
#   CI xanh trên main (push) ──workflow_run──► Deploy: chờ duyệt (environment production)
#                                              → OIDC lấy quyền AWS tạm thời
#                                              → SSM Run Command chạy /opt/taskhub/scripts/deploy.sh <sha7>
#                                              → smoke test từ Internet
#   Rollback / triển khai bản phát hành: Actions → Deploy → Run workflow → nhập image_tag (vd v0.4.0)
#
# Không có access key AWS nào trong GitHub. Không mở port 22.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image cần triển khai, ví dụ v0.4.0 hoặc 9f8e7d6'
        required: true
        type: string

permissions:
  contents: read

# Không bao giờ chạy hai lần deploy chồng lên nhau, cũng không hủy lần đang chạy dở.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # workflow_run: chỉ khi CI xanh, do PUSH vào main của CHÍNH repo này kích hoạt.
    # (Bộ lọc branches: [main] so tên nhánh — một PR từ fork có nhánh tên "main" cũng khớp.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production          # required reviewer (Module 05 bài 04) + vars bên dưới
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write           # cho phép xin OIDC token để đổi lấy quyền AWS tạm thời
    env:
      AWS_REGION: ap-southeast-1

    steps:
      # Input của workflow_dispatch do người gõ vào → kiểm tra định dạng trước khi
      # nó đi vào bất kỳ lệnh nào (chống chèn lệnh vào deploy.sh trên EC2).
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${RUN_SHA::7}"
          fi
          if [[ ! "$tag" =~ ^([0-9a-f]{7}|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::Tag không hợp lệ: '$tag' (chỉ nhận sha7 hoặc vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Triển khai taskhub:$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the taskhub instance
        id: instance
        run: |
          ids="$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=taskhub Name=tag:Name,Values=taskhub-app \
                      Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          count="$(wc -w <<< "$ids")"
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Cần đúng 1 instance taskhub-app đang chạy, tìm thấy $count"
            exit 1
          fi
          echo "id=$ids" >> "$GITHUB_OUTPUT"

      - name: Run deploy.sh on EC2 (SSM Run Command)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          # Lệnh được ghép bằng jq thành JSON hợp lệ; TAG đã được kiểm tra định dạng ở trên.
          params="$(jq -nc --arg c "/opt/taskhub/scripts/deploy.sh $TAG" \
            '{commands: [$c], executionTimeout: ["600"]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "taskhub deploy $TAG (run $GITHUB_RUN_ID)" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          # Tự hỏi trạng thái (waiter có sẵn của CLI chỉ chờ ~100 giây — không đủ cho deploy.sh).
          status="Pending"
          for _ in $(seq 1 60); do
            sleep 10
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- stdout của deploy.sh -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- stderr của deploy.sh -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          if [[ "$status" != "Success" ]]; then
            echo "::error::deploy.sh kết thúc với trạng thái $status (đọc stderr phía trên)"
            exit 1
          fi

      # Kiểm tra từ BÊN NGOÀI: đi qua Internet → Security Group → nginx → taskhub → PostgreSQL.
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused --max-time 5 \
            "$APP_URL/actuator/health" | grep -q '"status":"UP"'
          echo "Smoke test OK: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
