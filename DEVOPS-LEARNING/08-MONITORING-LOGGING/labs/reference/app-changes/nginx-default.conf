# Bản tham khảo v5 — thay docker/nginx/default.conf.
# Khác v0 đúng MỘT điểm: chặn /actuator/* từ Internet, chỉ để lại /actuator/health.
# Prometheus vẫn scrape được vì nó gọi thẳng taskhub:8080 trong Docker network, KHÔNG đi qua nginx.

upstream taskhub_backend {
    server taskhub:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Chung cho mọi location bên dưới (location kế thừa proxy_set_header của server
    # khi chính nó không khai báo proxy_set_header nào).
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # "=" khớp CHÍNH XÁC đường dẫn này và được ưu tiên trước mọi location tiền tố.
    # Healthcheck từ load balancer / smoke test của pipeline vẫn cần nó.
    location = /actuator/health {
        proxy_pass http://taskhub_backend;
    }

    # Mọi đường dẫn còn lại dưới /actuator/ (prometheus, info, ...) → 404 từ Internet.
    # 404 thay vì 403: không xác nhận cho người lạ là endpoint đó tồn tại.
    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://taskhub_backend;
    }
}
