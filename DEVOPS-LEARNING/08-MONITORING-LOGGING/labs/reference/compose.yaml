# Bản tham khảo v5 — chép thư mục này vào repo taskhub tại monitoring/.
# Chỉ mở sau khi đã tự viết (Module 08).
#
# Bộ giám sát là MỘT Compose project RIÊNG (taskhub-mon), vòng đời tách khỏi app:
# deploy lại app (project taskhub) không đụng tới Prometheus/Grafana/Loki.
# Chạy SAU app stack, từ gốc repo:
#   docker compose -p taskhub-mon -f monitoring/compose.yaml up -d
# (đường dẫn ./ trong file này tính từ thư mục monitoring/)

name: taskhub-mon

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d      # giữ 7 ngày...
      - --storage.tsdb.retention.size=2GB     # ...hoặc tới 2 GB, cái nào tới trước
      - --web.enable-lifecycle                # cho phép: curl -X POST localhost:9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"   # chỉ máy này truy cập được
    networks: [mon, app]
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      # Laptop: ALERTMANAGER_CONFIG=alertmanager.laptop.yml (gửi vào webhook-debug).
      # EC2: để mặc định alertmanager.yml (gửi Telegram).
      - --config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Thư mục secret KHÔNG commit: telegram_bot_token, telegram_chat_id, grafana_admin_password
      - ${MONITORING_SECRETS_DIR:-./secrets}:/etc/monitoring-secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    networks: [mon]
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host                                 # đọc filesystem của HOST, không phải container
      - --collector.textfile.directory=/textfile            # metric do script ghi ra (backup.sh)
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      # Tài liệu node_exporter dùng "/:/host:ro,rslave". Docker Desktop (laptop, kể cả qua WSL) từ chối rslave:
      # "path / is mounted on / but it is not a shared or slave mount" — đã gặp khi chạy thử.
      # Bỏ rslave: chạy được cả laptop lẫn EC2; đánh đổi: ổ gắn THÊM sau khi container khởi động sẽ không thấy.
      - /:/host:ro
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/node_exporter/textfile_collector}:/textfile:ro
    networks: [mon]
    mem_limit: 64m

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    networks: [mon]                   # không publish: chỉ Alloy và Grafana nói chuyện với Loki
    mem_limit: 384m

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      # ⚠️ Ai đọc được Docker socket là có quyền ngang root trên host (Docker bài 07).
      # :ro chỉ chặn ghi FILE socket, KHÔNG chặn gọi API. Chấp nhận vì Alloy là image chính thức,
      # ghim phiên bản, không publish port ra ngoài. Phương án khác: đọc file *-json.log.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"   # UI debug của Alloy — tùy chọn
    networks: [mon]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Hậu tố __FILE: Grafana đọc giá trị từ file → mật khẩu không nằm trong compose/env.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/monitoring-secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${MONITORING_SECRETS_DIR:-./secrets}:/etc/monitoring-secrets:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"   # EC2: vào bằng SSM port forwarding, KHÔNG mở SG
    networks: [mon]
    mem_limit: 384m        # đo thật: ~233 MiB lúc rảnh — 256m quá sát, dễ bị OOM khi mở dashboard nặng

  # Chỉ chạy trên laptop: COMPOSE_PROFILES=debug. Nhận webhook của Alertmanager và in ra log.
  webhook-debug:
    image: python:3.12-slim
    profiles: [debug]
    restart: unless-stopped
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./webhook-debug:/app:ro
    networks: [mon]
    mem_limit: 64m

networks:
  mon: {}
  app:
    # Network mặc định của app stack (project "taskhub" → "taskhub_default").
    # external: Compose không tạo/xóa nó — app stack phải chạy TRƯỚC.
    name: taskhub_default
    external: true

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
