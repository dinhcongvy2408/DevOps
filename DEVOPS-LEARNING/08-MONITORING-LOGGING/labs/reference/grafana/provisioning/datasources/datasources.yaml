# Bản tham khảo v5 — Grafana tự tạo datasource khi khởi động (provisioning = cấu hình dạng code).
# uid cố định → dashboard JSON tham chiếu được, không phụ thuộc id ngẫu nhiên.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy             # Grafana server gọi Prometheus, trình duyệt không gọi trực tiếp
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
    editable: false
