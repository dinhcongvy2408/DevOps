# Bản tham khảo v5 — Loki chế độ single binary (một process làm mọi việc), lưu trên filesystem.
# Đủ cho một máy chủ. Quy mô lớn: tách thành nhiều thành phần + lưu chunk trên S3 (đọc docs Loki).

auth_enabled: false            # một "tenant" duy nhất; Loki chỉ nghe trong network nội bộ

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb              # index TSDB — mặc định khuyến nghị của Loki 3.x
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h            # retention yêu cầu period 24h

limits_config:
  retention_period: 168h       # 7 ngày; compactor xóa dữ liệu cũ hơn
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true      # không bật thì retention_period KHÔNG có tác dụng
  delete_request_store: filesystem

analytics:
  reporting_enabled: false     # không gửi thống kê sử dụng về Grafana Labs
