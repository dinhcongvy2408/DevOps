# Bản tham khảo v5 — rule cảnh báo.
# Kiểm tra: promtool check rules /p/rules/alerts.yml   (xem lệnh docker ở đầu prometheus.yml)
#
# Quy tắc viết alert của dự án:
#   - Cảnh báo theo TRIỆU CHỨNG người dùng thấy (app chết, lỗi 5xx, chậm) trước nguyên nhân (CPU).
#   - Luôn có "for:" để bỏ qua dao động ngắn — tránh mệt mỏi vì cảnh báo (alert fatigue).
#   - severity: critical = xử lý ngay; warning = xử lý trong giờ làm việc.
#   - annotations nói rõ: chuyện gì, ở đâu, xem gì tiếp theo.

groups:
  - name: taskhub
    rules:
      - alert: TaskhubDown
        expr: up{job="taskhub"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "taskhub không trả lời Prometheus"
          description: "Scrape {{ $labels.instance }} thất bại hơn 1 phút. Kiểm tra: docker compose ps, docker logs taskhub, dashboard taskhub-overview."

      - alert: TaskhubHighErrorRate
        # Tỷ lệ request trả 5xx trên tổng request trong 5 phút. Không có traffic → 0/0 = NaN → không báo.
        expr: |
          sum(rate(http_server_requests_seconds_count{job="taskhub", status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="taskhub"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "taskhub trả lỗi 5xx cho hơn 5% request"
          description: "Tỷ lệ lỗi hiện tại {{ $value | humanizePercentage }}. Xem log level=ERROR trong Loki."

      - alert: TaskhubHighLatencyP95
        # p95 thời gian xử lý (bỏ qua /actuator/*) > 500 ms trong 10 phút.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="taskhub", uri!~"/actuator.*"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency của taskhub > 500 ms"
          description: "p95 hiện tại {{ $value | humanizeDuration }}."

  - name: host
    rules:
      - alert: HostDiskUsageHigh
        # Filesystem của HOST (node-exporter chạy với --path.rootfs=/host).
        # EC2: "/" là ổ gốc ext4 (chứa cả /var/lib/docker). Docker Desktop (laptop): VM không báo "/",
        # dữ liệu Docker nằm ở ổ riêng gắn tại /var/lib → bắt cả hai. Chỉ khớp "/" thì trên laptop alert IM LẶNG mãi.
        expr: |
          (1 - node_filesystem_avail_bytes{job="node", mountpoint=~"/|/var/lib", fstype!~"tmpfs|overlay|9p"}
             / node_filesystem_size_bytes{job="node", mountpoint=~"/|/var/lib", fstype!~"tmpfs|overlay|9p"}) * 100
          > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} của host đã dùng hơn 80%"
          description: "Đang dùng {{ $value | printf \"%.1f\" }}%. Dọn: docker image prune (có cân nhắc), log cũ, backup tạm."

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM của host dùng hơn 90%"
          description: "Đang dùng {{ $value | printf \"%.1f\" }}%. Xem docker stats — container nào ăn RAM?"

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Mất metric của host (node-exporter không trả lời)"
          description: "Không còn thấy disk/RAM — các alert host sẽ im lặng dù có sự cố."

  - name: backup
    rules:
      - alert: TaskhubBackupStale
        # backup.sh ghi metric này qua textfile collector của node-exporter sau mỗi lần backup THÀNH CÔNG.
        expr: time() - taskhub_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup PostgreSQL gần nhất đã quá 26 giờ"
          description: "Cron backup hằng ngày có thể đã hỏng. Kiểm tra: journalctl/cron log, chạy tay scripts/backup.sh."

      - alert: TaskhubBackupMetricMissing
        # Chưa bao giờ có backup thành công (hoặc file metric bị xóa) → TaskhubBackupStale không thể kích hoạt.
        expr: absent(taskhub_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Không thấy metric backup — backup chưa từng chạy thành công?"
          description: "Kiểm tra thư mục textfile collector và quyền ghi của backup.sh."
