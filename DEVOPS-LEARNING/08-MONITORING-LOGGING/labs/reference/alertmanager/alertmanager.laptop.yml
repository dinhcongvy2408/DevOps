# Bản tham khảo v5 — Alertmanager trên LAPTOP: gửi vào webhook-debug (in payload ra log).
# Dùng: ALERTMANAGER_CONFIG=alertmanager.laptop.yml và COMPOSE_PROFILES=debug khi chạy compose.
# Xem alert đến: docker logs -f taskhub-mon-webhook-debug-1

route:
  receiver: webhook-debug
  group_by: [alertname, severity]
  group_wait: 10s        # laptop: ngắn để thí nghiệm nhanh
  group_interval: 1m
  repeat_interval: 1h

inhibit_rules:
  - source_matchers: [alertname="TaskhubDown"]
    target_matchers: [alertname=~"TaskhubHighErrorRate|TaskhubHighLatencyP95"]

receivers:
  - name: webhook-debug
    webhook_configs:
      - url: http://webhook-debug:8080/alerts
        send_resolved: true
