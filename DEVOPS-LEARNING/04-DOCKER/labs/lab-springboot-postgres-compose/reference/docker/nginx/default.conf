# Bản tham khảo — reverse proxy trước taskhub (xem Networking bài 07).
# File này được bind mount vào /etc/nginx/conf.d/default.conf trong container nginx.

upstream taskhub_backend {
    # "taskhub" là tên service trong compose.yaml — DNS nội bộ của Docker phân giải.
    # Ở lab tuần 5 trên WSL, dòng này là: server 127.0.0.1:8080;
    server taskhub:8080;
}

server {
    listen 80;
    server_name _;

    # Giới hạn kích thước body request (mặc định của nginx là 1m).
    client_max_body_size 2m;

    location / {
        proxy_pass http://taskhub_backend;

        # Cho app biết host, IP thật của client và scheme gốc.
        # $http_host = header Host client gửi, GỒM CẢ PORT (localhost:8000). Dùng $host thì mất port
        # -> header Location của app thành http://localhost/api/tasks/1 (sai) — đã kiểm chứng khi chạy lab.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không kết nối được trong 5s -> 502/504 nhanh thay vì treo 60s mặc định.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
