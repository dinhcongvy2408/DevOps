# reports — hệ thống nhận báo cáo tự động. Tuần trước team đã "tối ưu và siết bảo mật".
name: ck04

services:
  web:
    image: nginx:1.30-alpine
    ports:
      - "18001:80"
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  api:
    build: ./api
    volumes:
      - reports:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  worker:
    build: ./worker
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    networks:
      - jobs

networks:
  backend:
  jobs:

volumes:
  reports:
