# Bản tham khảo cho taskhub v4. Đặt ở: infra/ansible/ansible.cfg
# Ansible chỉ đọc file này khi bạn chạy lệnh TỪ thư mục infra/ansible/ (thư mục hiện tại).
# Kiểm tra file đang được dùng: ansible --version  → dòng "config file = ..."

[defaults]
# Inventory động: đọc danh sách EC2 từ AWS API (tag Project=taskhub)
inventory = inventory/aws_ec2.yml
roles_path = roles
# Ubuntu 24.04 có sẵn /usr/bin/python3 (3.12) → chỉ định thẳng, khỏi cảnh báo "interpreter discovery"
interpreter_python = /usr/bin/python3
# In kết quả task dạng YAML, dễ đọc hơn JSON một dòng (ansible-core ≥ 2.13)
callback_result_format = yaml
# Mỗi lần gọi qua SSM chậm hơn SSH: cho thời gian chờ dài hơn mặc định
timeout = 60
