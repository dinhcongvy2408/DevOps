# Bản tham khảo cho taskhub v4. Đặt ở: infra/ansible/requirements.yml
# Cài: ansible-galaxy collection install -r requirements.yml
# Collection cài vào ~/.ansible/collections — được tìm TRƯỚC bản đi kèm gói `ansible`,
# nên phiên bản ghim ở đây là phiên bản thật sự chạy. Kiểm tra: ansible-galaxy collection list amazon.aws
# Phiên bản kiểm tra ngày 2026-10-31.

collections:
  - name: amazon.aws
    version: "12.0.0"      # inventory aws_ec2 + connection aws_ssm; cần boto3/botocore >= 1.38.23
  - name: community.docker
    version: "5.4.0"       # connection community.docker.docker (lab local bài 05)
